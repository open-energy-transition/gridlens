name: New project or organization
description: An organization uses one of the tracked energy system models (PLEXOS, PyPSA, …)
labels: ["data"]
body:
  - type: markdown
    attributes:
      value: |
        Every entry needs a public source that names the organization and the tool. A tool's own vendor or developer is not listed as a user.
  - type: input
    id: organization
    attributes:
      label: Organization
    validations:
      required: true
  - type: input
    id: country
    attributes:
      label: Country
    validations:
      required: true
  - type: input
    id: tool
    attributes:
      label: Tool
      description: One of the tools on gridlens.org.
      placeholder: PyPSA
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: How the organization was involved
      options:
        - Ran the model itself
        - Commissioned or paid for the study
        - Ran the model for a client (consultancy)
        - Research
        - Its system was modelled by others
        - Not sure
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source
      description: A public link (the organization's own document is best, a vendor case study is weaker).
    validations:
      required: true
  - type: textarea
    id: quote
    attributes:
      label: Quote from the source
      description: The sentence that names the organization and the tool.
    validations:
      required: true
