name: Data correction
description: A project, organization or tool is wrong or out of date
labels: ["data"]
body:
  - type: markdown
    attributes:
      value: |
        Corrections need a public source, the same standard as every entry in the dataset (see data/DATA_SCHEMA.md).
  - type: input
    id: entry
    attributes:
      label: Which entry
      description: The organization or project name, and a link to where it appears.
      placeholder: "ENTSO-E, https://gridlens.org/organizations?orgs_q=ENTSO-E"
    validations:
      required: true
  - type: textarea
    id: wrong
    attributes:
      label: What is wrong, and what is correct
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source
      description: A public link that shows the correct information (the organization's own document is best).
    validations:
      required: true
  - type: dropdown
    id: affiliation
    attributes:
      label: Your relation to the entry
      options:
        - None
        - I work for the organization
        - I work for the tool's vendor or developer
